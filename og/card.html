<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=M+PLUS+Rounded+1c:wght@800&family=Zen+Maru+Gothic:wght@700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #bfe3f7;
    font-family: "Zen Maru Gothic", sans-serif;
    color: #5a4a50;
    position: relative;
  }
  .text {
    position: absolute;
    left: 80px;
    top: 0;
    bottom: 60px;
    width: 520px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .label {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.25em;
    color: #2a72a8;
  }
  h1 {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 104px;
    letter-spacing: 0.08em;
    margin: 6px 0 18px;
    line-height: 1.1;
  }
  .lead {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 1.45;
    margin: 0 0 24px;
  }
  .lead em { font-style: normal; color: #b8336e; }
  .chips { display: flex; gap: 12px; }
  .chips span {
    background: #fff;
    border-radius: 999px;
    padding: 6px 20px;
    font-size: 24px;
    color: #b8336e;
  }
  .cats {
    position: absolute;
    right: 50px;
    bottom: 92px;
    width: 560px;
    height: 460px;
  }
  .cats img {
    position: absolute;
    border: 8px solid #fff;
    border-radius: 40px;
    object-fit: cover;
  }
  .cat-left { width: 200px; height: 250px; left: 0; bottom: 0; transform: rotate(-5deg); }
  .cat-right { width: 200px; height: 250px; right: 0; bottom: 0; transform: rotate(5deg); }
  .cat-center { width: 260px; height: 325px; left: 150px; bottom: 50px; z-index: 1; }
  .wave {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60px;
    background: radial-gradient(circle at 30px 0, transparent 30px, #fff 31px) 0 0 / 60px 60px repeat-x;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="label">KOTOBA NEKO</div>
    <h1>ことば猫</h1>
    <p class="lead">その言葉、<em>本当は</em><br>どっちの意味？</p>
    <div class="chips"><span>アニメ</span><span>漫画</span><span>読みもの</span><span>ゲーム</span></div>
  </div>
  <div class="cats">
    <img class="cat-left" src="../images/cats3d/cat-01.jpg" alt="">
    <img class="cat-right" src="../images/cats3d/cat-03.jpg" alt="">
    <img class="cat-center" src="../images/cats3d/cat-main.jpg" alt="">
  </div>
  <div class="wave"></div>
</body>
</html>
