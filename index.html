    <h1>言葉ジグソー</h1>
    <p>誤解されやすい日本語を、毛筆の文字のジグソーパズルにする iPhone アプリです。パズルを完成させると、その言葉の正しい意味と、よくある誤解が表示されます。</p>

    <h2>お問い合わせ</h2>
    <p>不具合の報告、言葉の解説の誤りのご指摘、ご要望は、<a href="https://github.com/masanorifunaki/kotoba-jigsaw-hp/issues">GitHub の Issues</a> で受け付けます。投稿には GitHub のアカウントが必要です。</p>
    <p>不具合の報告には、iPhone の機種、iOS のバージョン、起きたときの操作を書いていただけると助かります。</p>

    <h2>プライバシーポリシー</h2>
    <p>本アプリは利用者の個人情報を収集しません。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。</p>
  </main>
